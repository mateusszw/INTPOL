name: Converter PDFs em Markdown
on:
  push:
    paths: ["pdfs/**.pdf"]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 scripts/convert_pdf.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base INDEX.md
          git diff --cached --quiet || (git commit -m "Converter PDFs em Markdown" && git push)
